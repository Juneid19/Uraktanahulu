<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Muarasipongi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  color: #fff;
  height: 100vh;
  overflow: hidden;
}

/* --- CROSSFADE BACKGROUND TANPA KILAT --- */

.bgA, .bgB {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-size: cover;
  background-position: center;
  transition: opacity 2s ease-in-out;
  z-index: -1;
}

/* layer awal */
.bgA { opacity: 1; }
.bgB { opacity: 0; }

/* --- PLAYER --- */
.player {
  width: 80%;
  max-width: 370px;
  margin: 40px auto;
  padding: 25px;
  background: rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  backdrop-filter: blur(1px);
  text-align: center;
}

/* RADIO NAME */
h2{
  font-size:26px;
  margin-bottom:6px
}

/* COVER ART */
.cover {
  width: 180px;
  height: 180px;
  border-radius: 10px;
  margin: 0 auto 20px;
  background-size: cover;
  background-position: center;
}

#title {
  font-size: 17px;
  font-weight: bold;
  margin-top: 10px;
}

#artist {
  font-size: 10px;
  opacity: 0.85;
  margin-bottom: 20px;
}

/* PLAY BUTTON */
.play-btn {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  margin: 10px auto 20px;
  background: rgba(4,255,255,0.7);
  border: 2px solid lightblue;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.3s;
}

.play-btn i {
  font-size: 30px;
}

.play-btn:hover {
  transform: scale(1.08);
}

/* VOLUME */
.volume {
  -webkit-appearance: none;
  width: 90%;
  height: 7px;
  background: rgba(180,220,255,0.7);
  border-radius: 5px;
  cursor: pointer;
}
.volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(150,200,255,1);
}
  .credit {
  position: fixed;
  bottom: 10px;
  right: 10px;
  font-size: 12px;
  font-style: italic;
  color: rgba(255,255,255,0.6);
  z-index: 999;
  pointer-events: none; /* supaya tidak mengganggu klik */
}

</style>
</head>

<body>

<!-- dua layer background -->
<div class="bgA" id="bgA"></div>
<div class="bgB" id="bgB"></div>

<div class="player" id="playerBox">
  <h2>Muarasipongi</h2>

  <div class="cover" id="cover"></div>
  <div id="title">Memuat...</div>
  <div id="artist"></div>

  <div class="play-btn" id="playButton">
      <i id="playIcon">▶</i>
  </div>

  <input type="range" min="0" max="100" value="70" class="volume" id="volumeSlider">
</div>

<audio id="radio" src="https://stream.zeno.fm/2vygvb37gkeuv"></audio> 
  <div class="credit">prepared by Juneid</div>

<script>
/* --- BACKGROUND GANTI TANPA KILAT --- */
const images = [
  "https://images.unsplash.com/photo-1501785888041-af3ef285b470",
  "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
  "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1920&h=1080",
  "https://images.unsplash.com/photo-1433878455169-4698e60005b1?auto=format&fit=crop&w=1920&h=1080",
  "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&h=1080",
  "https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1920&h=1080",
  "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1920&h=1080",
  "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1920&h=1080"
];

let index = 0;
let active = true;
const bgA = document.getElementById("bgA");
const bgB = document.getElementById("bgB");

function nextBg() {
  index = (index + 1) % images.length;

  if (active) {
    bgB.style.backgroundImage = `url(${images[index]})`;
    bgA.style.opacity = 0;
    bgB.style.opacity = 1;
  } else {
    bgA.style.backgroundImage = `url(${images[index]})`;
    bgA.style.opacity = 1;
    bgB.style.opacity = 0;
  }

  active = !active;
}

nextBg();
setInterval(nextBg, 20000);


/* --- PLAYER SCRIPT TETAP SAMA --- */

const id = "2vygvb37gkeuv";
const api = `https://zenoplay.zenomedia.com/api/zenofm/nowplaying/${id}`;
const defaultCover = "https://dpi4fupzvxbqq.cloudfront.net/rfm/uploads/blogo/300/300_1470024235.png";

const audio = document.getElementById("radio");
const titleEl = document.getElementById("title");
const artistEl = document.getElementById("artist");
const coverEl = document.getElementById("cover");
const playBtn = document.getElementById("playButton");
const playIcon = document.getElementById("playIcon");

/* PLAY/PAUSE */
playBtn.onclick = () => {
  if (audio.paused) {
    audio.play();
    playIcon.textContent = "❚❚";
  } else {
    audio.pause();
    playIcon.textContent = "▶";
  }
};

/* VOLUME */
document.getElementById("volumeSlider").oninput = function() {
  audio.volume = this.value / 100;
};

/* COVER ART ITUNES */
async function getCover(artist, title) {
  try {
    const q = encodeURIComponent(`${artist} ${title}`);
    const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=1`);
    const data = await res.json();
    if (data.results.length > 0) {
      return data.results[0].artworkUrl100.replace("100x100bb.jpg","600x600bb.jpg");
    }
  } catch {}
  return defaultCover;
}

/* UPDATE NOW PLAYING */
async function updateSong() {
  try {
    const res = await fetch(api);
    const data = await res.json();
    const text = data.title || "Live Stream";

    let artist = "";
    let title = text;

    if (text.includes(" - ")) {
      artist = text.split(" - ")[0].trim();
      title = text.split(" - ")[1].trim();
    }

    titleEl.textContent = title;
    artistEl.textContent = artist;

    const cover = await getCover(artist, title);
    coverEl.style.backgroundImage = `url("${cover}")`;

  } catch(e) {
    titleEl.textContent = "Radio Stream";
    coverEl.style.backgroundImage = `url("${defaultCover}")`;
  }
}

updateSong();
setInterval(updateSong, 10000);
</script>

</body>
</html>
